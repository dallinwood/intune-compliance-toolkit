---

- name: "18.4.2 | PATCH | Ensure Configure SMB v1 client driver is set to Enabled Disable driver recommended"
  when: win22cis_rule_18_4_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.4.2
    - patch
    - smb
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\mrxsmb10
    name: Start
    data: 4
    type: dword

- name: "18.4.6 | PATCH | Ensure 'NetBT NodeType configuration' is set to 'Enabled: P-node recommended'"
  when: win22cis_rule_18_4_6
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.4.6
    - patch
    - netbt
    - NIST800-171_3.4.1
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-171_3.13.1
    - NIST800-171_3.13.2
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_AC-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-7_1
    - NIST800-53R5_CM-9
    - NIST800-53R5_SA-3
    - NIST800-53R5_SA-8
    - NIST800-53R5_SA-10
  block:
    - name: "18.4.6 | PATCH | Ensure 'NetBT NodeType configuration' is set to 'Enabled: P-node recommended' | Set Registry Value"
      when: win22cis_netbt_nodetype in [1, 2, 4, 8]
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters
        value: NodeType
        data: "{{ win22cis_netbt_nodetype }}"
        datatype: dword

    - name: "18.4.6 | AUDIT | Ensure 'NetBT NodeType configuration' is set to 'Enabled: P-node recommended' | Warning Message"
      when: win22cis_netbt_nodetype not in [1, 2, 4, 8]
      ansible.builtin.debug:
        msg:
          - "Warning!! You have an variable set in win22cis_netbt_nodetype please read"
          - "the notes for the variable and make the necessary change to the variable to be in compliance."

    - name: "18.4.6 | AUDIT | Ensure 'NetBT NodeType configuration' is set to 'Enabled: P-node recommended' | Set warning count"
      when: win22cis_netbt_nodetype not in [1, 2, 4, 8]
      vars:
        warn_control_id: '18.4.6'
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "18.4.7 | PATCH | Ensure WDigest Authentication is set to Disabled"
  when: win22cis_rule_18_4_7
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.4.7
    - patch
    - wdigest
    - NIST800-171_3.5.2
    - NIST800-171_3.13.6
    - NIST800-53R5_IA-5_1
    - NIST800-53R5_SC-28
    - NIST800-53R5_SC-28_1
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\Wdigest
    value: UseLogonCredential
    data: 0
    datatype: dword
