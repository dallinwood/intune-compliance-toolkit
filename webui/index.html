<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intune Compliance Toolkit</title>
    <!-- Sets the theme class before first paint so a dark page never flashes
         light. Mirrors createThemeController in src/state/theme.ts. -->
    <script>
      ;(function () {
        var storedTheme = null
        try {
          storedTheme = localStorage.getItem('intune-toolkit:theme')
        } catch (error) {}
        var isDark = storedTheme === 'dark' || (storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
